<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="assets/css/pico.jade.css" />
        <link rel="stylesheet" href="assets/css/index.css" />
    </head>
    <body>
        <main class="container">
            <div class="grid">
                <label for="days_checkbox">Display days next to username</label>
                <div><input type="checkbox" name="days" id="days_checkbox" role="switch" /></div>

                <label for="days_input">Minimum account age (days)</label>
                <div><input type="number" name="min_days" id="days_input" placeholder="example: 300" /></div>

                <label for="spammers_checkbox">Mark spammers</label>
                <div><input type="checkbox" name="spammers" id="spammers_checkbox" role="switch" /></div>

                <label for="spammers_hours_input">Spammer threshold (hours/post)</label>
                <div><input type="number" name="spammers_hours" id="spammers_hours_input" placeholder="example: 12" /></div>

                <label for="cheers_checkbox">Hide cheers</label>
                <div><input type="checkbox" name="cheers" id="cheers_checkbox" role="switch" /></div>

                <label for="more_downvotes_checkbox">Hide posts with more downvotes than upvotes</label>
                <div><input type="checkbox" name="more_downvotes" id="more_downvotes_checkbox" role="switch" /></div>

                <label for="hide_spammers_checkbox">Hide spammers</label>
                <div><input type="checkbox" name="hide_spammers" id="hide_spammers_checkbox" role="switch" /></div>

                <label for="always_display_upvotes_checkbox">Always display upvotes</label>
                <div><input type="checkbox" name="always_display_upvotes" id="always_display_upvotes_checkbox" role="switch" /></div>

                <label for="show_controls_checkbox">Show video controls</label>
                <div><input type="checkbox" name="show_controls" id="show_controls_checkbox" role="switch" /></div>

                <label for="hide_meme_checkbox">Hide create meme button</label>
                <div><input type="checkbox" name="hide_meme" id="hide_meme_checkbox" role="switch" /></div>
            </div>
        </main>
        <script src="assets/js/cash.js"></script>
        <script src="assets/js/variables.js"></script>
        <script src="assets/js/index.js"></script>
    </body>
</html>
